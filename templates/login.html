{% extends "base.html" %}

{% block title %}
Iniciar sesión - StudySpace
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="text-center fw-bold mb-2">
                        Iniciar sesión
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Ingresa a tu cuenta de StudySpace
                    </p>


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Usuario
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="username"
                                placeholder="Ingresa tu usuario"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                placeholder="Ingresa tu contraseña"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Iniciar sesión
                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <span class="text-muted">
                            ¿No tienes una cuenta?
                        </span>

                        <a href="/registro">
                            Regístrate
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
